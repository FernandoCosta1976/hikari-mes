<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>HIKARI MES</title>
    <!--
      GitHub Pages SPA deep-link fallback (rafgraph/spa-github-pages pattern).
      Encodes the requested path into a query string and redirects to the
      app's index.html, which decodes it back via history.replaceState.
      pathSegmentsToKeep = 1 preserves the "/hikari-mes/" repository segment.
    -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
